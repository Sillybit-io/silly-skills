name: Gitleaks

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 refuses to scan an organization-owned repository
      # without a paid GITLEAKS_LICENSE secret, and this repository belongs to an
      # organization. The gitleaks CLI that action wraps is MIT-licensed and
      # carries no such gate, so the scan runs from a pinned release binary whose
      # SHA-256 is checked before it is allowed to execute. `gitleaks git` reads
      # the whole commit history, which is what the fetch-depth above is for.
      - name: Scan the full history for credentials
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $TARBALL" | sha256sum --check --strict
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose
